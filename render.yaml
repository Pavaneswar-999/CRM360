services:
  - type: web
    name: crm360-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_ISSUER
        value: crm360-api
      - key: JWT_AUDIENCE
        value: crm360-web
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 14
      - key: CLIENT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: RESET_TOKEN_TTL_MINUTES
        value: 30
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
