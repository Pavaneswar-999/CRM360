name: CRM360 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --prefix client --omit=dev --audit-level=high
      - run: npm audit --prefix server --omit=dev --audit-level=high
